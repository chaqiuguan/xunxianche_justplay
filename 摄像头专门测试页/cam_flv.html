<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>低延迟 FLV 摄像头测试</title>
<script src="mpegts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Microsoft YaHei',Arial,sans-serif;min-height:100vh;padding:10px}
h1{text-align:center;font-size:17px;padding:6px 0;color:#fff}
.subtitle{text-align:center;font-size:11px;color:#888;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:8px;margin-bottom:8px}
.panel{background:#16213e;border:2px solid #0f3460;border-radius:6px;overflow:hidden}
.panel.ok{border-color:#67c23a}.panel.err{border-color:#f56c6c}.panel.wait{border-color:#e6a23c}
.ph{padding:6px 10px;font-size:12px;background:rgba(255,255,255,.03);display:flex;justify-content:space-between}
.vbox{background:#000;min-height:260px;position:relative;display:flex;align-items:center;justify-content:center}
.vbox video{width:100%;height:100%;object-fit:contain}
.vbox .msg{text-align:center;color:#666;font-size:12px;position:absolute}
.vbox .msg .icon{font-size:36px;display:block;margin-bottom:4px}
.foot{padding:4px 10px;font-size:10px;color:#888;background:rgba(0,0,0,.2);display:flex;justify-content:space-between}
.g{color:#67c23a}.r{color:#f56c6c}.y{color:#e6a23c}

/* Log panel */
#logWrap{max-width:100%;margin:0 auto;background:#0f3460;border-radius:6px;overflow:hidden}
#logHead{padding:6px 12px;background:rgba(0,0,0,.2);font-size:12px;display:flex;justify-content:space-between;align-items:center}
#log{height:180px;overflow-y:auto;padding:8px 12px;font-size:10px;line-height:1.6;font-family:Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:#ccc}
.log-line{margin:0}.log-line .ts{color:#666}.log-line.ok{color:#67c23a}.log-line.err{color:#f56c6c}.log-line.info{color:#409eff}
</style>
</head>
<body>
<h1>📹 低延迟 FLV 摄像头</h1>
<div class="subtitle">
  RTSP (H.264) → ffmpeg → FLV → Python HTTP → mpegts.js (MSE) → &lt;video&gt;
  &nbsp;|&nbsp; 预期延迟 <span class="g">1~3 秒</span>
</div>
<div class="grid" id="grid"></div>

<div id="logWrap">
  <div id="logHead">
    <b>📋 日志</b>
    <span style="font-size:10px;color:#666">低延迟 FLV 模式 &nbsp;|&nbsp; 服务器 127.0.0.1:8088</span>
  </div>
  <div id="log"><span class="log-line"><span class="ts">--:--:--</span> 等待启动...</span></div>
</div>

<script>
var cameras = [
  {name:'摄像头1', url:'/flv/cam1'},
  {name:'摄像头2', url:'/flv/cam2'},
  {name:'摄像头3', url:'/flv/cam3'},
  {name:'摄像头4', url:'/flv/cam4'},
];
var players = {};
var statsTimers = {};

// ===== Log =====
function log(msg, cls) {
  var el = document.getElementById('log');
  var now = new Date();
  var ts = ('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);
  var line = document.createElement('div');
  line.className = 'log-line' + (cls ? ' '+cls : '');
  line.innerHTML = '<span class="ts">'+ts+'</span> ' + msg;
  // Only auto-scroll if user is already near the bottom (within 40px)
  var atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 40;
  el.appendChild(line);
  if (atBottom) { el.scrollTop = el.scrollHeight; }
  console.log(ts + ' ' + msg);
}

// ===== Build UI =====
var grid = document.getElementById('grid');
cameras.forEach(function(c, i) {
  grid.innerHTML +=
    '<div class="panel wait" id="p'+i+'">'+
    '<div class="ph"><b>📷 '+c.name+'</b><span id="tag'+i+'" style="font-size:11px">等待</span></div>'+
    '<div class="vbox">'+
    '<video id="v'+i+'" autoplay muted playsinline></video>'+
    '<div class="msg" id="msg'+i+'"><span class="icon">🎥</span>等待连接...</div>'+
    '</div>'+
    '<div class="foot"><span id="ftL'+i+'">FLV | '+c.url+'</span><span id="ftR'+i+'">--</span></div>'+
    '</div>';
});

// ===== Start cameras =====
log('=== 低延迟 FLV 模式启动 ===', 'info');
log('mpegts.js: ' + (typeof mpegts !== 'undefined' ? '已加载' : '未加载!'), typeof mpegts !== 'undefined' ? 'ok' : 'err');
log('MSE 支持: ' + (mpegts.isSupported() ? '是' : '否'), mpegts.isSupported() ? 'ok' : 'err');

if (typeof mpegts === 'undefined' || !mpegts.isSupported()) {
  log('ERROR: 浏览器不支持 MSE，无法使用 FLV 模式', 'err');
} else {
  cameras.forEach(function(c, i) {
    setTimeout(function() { startCamera(i); }, i * 500);
  });
}

function startCamera(i) {
  stopCamera(i);
  var c = cameras[i];
  var video = document.getElementById('v'+i);
  var tag = document.getElementById('tag'+i);
  var msg = document.getElementById('msg'+i);
  var panel = document.getElementById('p'+i);
  var ftL = document.getElementById('ftL'+i);
  var ftR = document.getElementById('ftR'+i);

  tag.textContent = '⏳ 连接中...'; tag.style.color = '#e6a23c';
  panel.className = 'panel wait';
  msg.style.display = ''; msg.innerHTML = '<span class="icon">🎥</span>正在连接...';
  video.style.display = 'none';

  log('cam'+(i+1)+' 开始连接: ' + c.url, 'info');
  var t0 = Date.now();

  try {
    var player = mpegts.createPlayer({
      type: 'flv',
      isLive: true,
      url: c.url,
      hasAudio: false,
      hasVideo: true,
      enableStashBuffer: false,
      stashInitialSize: 128,
      lazyLoad: false
    });
    players[i] = player;

    player.on(mpegts.Events.MEDIA_INFO, function(info) {
      var el = ((Date.now()-t0)/1000).toFixed(1);
      log('cam'+(i+1)+' ✅ MEDIA_INFO ('+el+'s) ' + JSON.stringify(info), 'ok');
      tag.textContent = '✅ FLV'; tag.style.color = '#67c23a';
      panel.className = 'panel ok';
      msg.style.display = 'none';
      video.style.display = '';
      ftR.textContent = '连接成功 ('+el+'s)';
    });

    player.on(mpegts.Events.STATISTICS_INFO, function(s) {
      var el = ((Date.now()-t0)/1000).toFixed(0);
      ftR.textContent = '📥'+(s.speed||0).toFixed(0)+'KB/s | fps:'+(s.decodeFps||0).toFixed(0)+' | '+el+'s';
      if (video.videoWidth > 0 && tag.textContent.indexOf('✅') < 0) {
        tag.textContent = '✅ FLV'; tag.style.color = '#67c23a';
        panel.className = 'panel ok';
        msg.style.display = 'none';
        video.style.display = '';
      }
    });

    var reconnectCount = 0;
    var maxReconnect = 20;

    player.on(mpegts.Events.ERROR, function(type, info) {
      log('cam'+(i+1)+' ❌ ERROR: '+type+' '+JSON.stringify(info), 'err');
      tag.textContent = '❌ '+type; tag.style.color = '#f56c6c';
      panel.className = 'panel err';
      ftR.textContent = 'ERR: ' + type;
      msg.innerHTML = '<span class="icon">❌</span>'+type;
      msg.style.display = '';

      // Auto-reconnect after delay
      if (reconnectCount < maxReconnect) {
        reconnectCount++;
        var delay = Math.min(1000 * reconnectCount, 10000);
        log('cam'+(i+1)+' 🔄 '+reconnectCount+'/'+maxReconnect+' 重连, '+ (delay/1000).toFixed(0) + 's 后...', 'info');
        stopCamera(i);
        setTimeout(function() { startCamera(i); }, delay);
      } else {
        log('cam'+(i+1)+' ⛔ 重连次数耗尽', 'err');
      }
    });

    player.on(mpegts.Events.LOADING_COMPLETE, function() {
      log('cam'+(i+1)+' LOADING_COMPLETE (流结束)', 'info');
    });

    player.attachMediaElement(video);
    player.load();

  } catch(e) {
    log('cam'+(i+1)+' ❌ 异常: ' + e.message, 'err');
    // Also reconnect on exception
    var delay2 = 3000;
    log('cam'+(i+1)+' 🔄 异常重连, '+ (delay2/1000).toFixed(0) + 's 后...', 'info');
    stopCamera(i);
    setTimeout(function() { startCamera(i); }, delay2);
    tag.textContent = '❌'; tag.style.color = '#f56c6c';
    panel.className = 'panel err';
    ftR.textContent = 'EX: '+e.message;
  }
}

function stopCamera(i) {
  if (players[i]) {
    try { players[i].destroy(); } catch(e) {}
    players[i] = null;
  }
  var v = document.getElementById('v'+i);
  if (v) { v.pause(); v.src = ''; }
}
</script>
</body>
</html>
