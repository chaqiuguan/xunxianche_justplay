<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTSP → HLS 摄像头测试</title>
<script src="hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Microsoft YaHei',Arial,sans-serif;min-height:100vh;padding:12px}
h1{text-align:center;font-size:18px;padding:8px 0;color:#fff}
.status{text-align:center;font-size:12px;color:#909399;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:10px}
.panel{background:#16213e;border:2px solid #0f3460;border-radius:8px;overflow:hidden}
.panel.ok{border-color:#67c23a}.panel.err{border-color:#f56c6c}
.ph{padding:8px 12px;font-size:13px;background:rgba(255,255,255,.03);display:flex;justify-content:space-between}
.vbox{background:#000;min-height:300px;display:flex;align-items:center;justify-content:center;position:relative}
.vbox video{width:100%;height:100%;object-fit:contain}
.vbox .msg{text-align:center;color:#666;font-size:13px;position:absolute}
.vbox .msg .icon{font-size:40px;display:block;margin-bottom:6px}
.foot{padding:6px 12px;font-size:11px;color:#888;background:rgba(0,0,0,.2)}
.g{color:#67c23a}.r{color:#f56c6c}.y{color:#e6a23c}
</style>
</head>
<body>
<h1>📹 RTSP → HLS 摄像头 (ffmpeg 直连)</h1>
<div class="status">
  ffmpeg 直接从摄像头拉 RTSP (H.264) → HLS 分段 → 浏览器原生播放 | <span class="g">无需 WASM</span>
</div>
<div class="grid" id="grid"></div>
<script>
var cameras = [
  {name:'摄像头1', hls:'/hls_output/cam1/index.m3u8'},
  {name:'摄像头2', hls:'/hls_output/cam2/index.m3u8'},
  {name:'摄像头3', hls:'/hls_output/cam3/index.m3u8'},
  {name:'摄像头4', hls:'/hls_output/cam4/index.m3u8'},
];

var grid = document.getElementById('grid');
cameras.forEach(function(c, i) {
  grid.innerHTML +=
    '<div class="panel" id="p'+i+'">'+
    '<div class="ph"><b>📷 '+c.name+'</b><span id="tag'+i+'" style="font-size:11px;color:#909399">等待</span></div>'+
    '<div class="vbox">'+
    '<video id="v'+i+'" autoplay muted playsinline></video>'+
    '<div class="msg" id="msg'+i+'"><span class="icon">🎥</span>加载中...</div>'+
    '</div>'+
    '<div class="foot" id="foot'+i+'">HLS: '+c.hls+'</div>'+
    '</div>';
});

// Play each camera
cameras.forEach(function(c, i) {
  var video = document.getElementById('v'+i);
  var tag = document.getElementById('tag'+i);
  var msg = document.getElementById('msg'+i);
  var panel = document.getElementById('p'+i);
  var foot = document.getElementById('foot'+i);

  // Use native HLS support (Safari) or hls.js polyfill
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari - native HLS
    video.src = c.hls;
    tag.textContent = '原生HLS';
    tag.style.color = '#67c23a';
  } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    // Chrome/Firefox - hls.js
    var hls = new Hls({ liveDurationInfinity: true, maxBufferLength: 30 });
    hls.loadSource(c.hls);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play();
      tag.textContent = '✅';
      tag.style.color = '#67c23a';
      panel.className = 'panel ok';
    });
    hls.on(Hls.Events.ERROR, function(ev, data) {
      if (data.fatal) {
        tag.textContent = '❌';
        tag.style.color = '#f56c6c';
        panel.className = 'panel err';
        msg.innerHTML = '<span class="icon">❌</span>HLS error: '+data.details;
        msg.style.display = '';
      }
    });
    video._hls = hls;
  } else {
    tag.textContent = '❌ 不支持';
    tag.style.color = '#f56c6c';
    msg.innerHTML = '<span class="icon">❌</span>浏览器不支持HLS';
  }

  // Monitor
  video.addEventListener('playing', function() {
    msg.style.display = 'none';
    video.style.display = '';
    tag.textContent = '✅';
    tag.style.color = '#67c23a';
    panel.className = 'panel ok';
  });
  video.addEventListener('error', function() {
    tag.textContent = '⚠️';
    tag.style.color = '#e6a23c';
    foot.textContent = '等待HLS数据...';
  });

  // Periodic status
  setInterval(function() {
    if (video.videoWidth > 0) {
      foot.textContent = video.videoWidth + 'x' + video.videoHeight + ' | HLS OK';
    } else {
      foot.textContent = '等待数据... ' + c.hls;
    }
  }, 3000);
});
</script>
</body>
</html>
